[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-pr-review-agent"
version = "0.1.0"
description = "Selective multi-agent pull request reviewer: four grounded specialists, a confidence gate, and a human approval queue."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "asyncpg>=0.29",
    "redis>=5.0",
    "arq>=0.26",
    "langgraph>=1.0",
    "ormsgpack>=1.5",
    "openai>=1.40",
    "pyjwt[crypto]>=2.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "fakeredis>=2.23", "ruff>=0.6"]
otel = [
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
]

[project.scripts]
pr-review = "backend.cli:main"

[tool.setuptools.packages.find]
include = ["backend*", "scripts*"]

[tool.setuptools.package-data]
backend = ["prompts/templates/*.md", "economics/pricing.json", "evaluation/baseline.json"]
scripts = ["migrations/*.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: needs a live Postgres (TEST_DATABASE_URL) and/or Redis (TEST_REDIS_URL)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = [
    "E501",      # line length is handled by the formatter
    "B008",      # FastAPI's Depends() in defaults is the framework's idiom
    "UP042",     # (str, Enum) keeps values JSON-friendly on every supported Python
    "ASYNC109",  # explicit timeout parameters are part of the LLM client contract
    "ASYNC240",  # small file reads at startup and in the CLI
]
